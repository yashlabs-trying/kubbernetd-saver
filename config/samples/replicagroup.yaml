apiVersion: kubbernetd.io/v1
kind: ReplicaGroup
metadata:
  name: my-model-serving
  namespace: default
spec:
  model:
    name: meta-llama/Llama-8B
    engine: vLLM
    precision: bf16
    tensorParallel: 1
    pipelineParallel: 1
    gpuPerWorker: 1
    workers: 1
    weightShards: 1
    shardPattern: ""
  weightCache:
    nodeNVMe: false
    cpuRAM: false
    gpuVRAM: false
  targetRef:
    kind: Deployment
    name: my-model
  wakeSLO: 30
  coldStartTimeout: 120
  bootstrap:
    enabled: false
  sleepPolicy:
    sleepDepth: full
    idleTimeout: 300
    activeSequenceThreshold: 0