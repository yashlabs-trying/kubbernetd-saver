apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: replicagroups.kubbernetd.io
spec:
  group: kubbernetd.io
  names:
    kind: ReplicaGroup
    plural: replicagroups
    singular: replicagroup
    shortNames: [rg, rgs]
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                model:
                  type: object
                  properties:
                    name: {type: string}
                    engine: {type: string, enum: [vLLM, SGLang, TGI], default: vLLM}
                    precision: {type: string, default: bf16}
                    tensorParallel: {type: integer, minimum: 1, default: 1}
                    pipelineParallel: {type: integer, minimum: 1, default: 1}
                    gpuPerWorker: {type: integer, minimum: 1, default: 1}
                    workers: {type: integer, minimum: 1}
                    weightShards: {type: integer, default: 1}
                  required: [name, workers]
                weightCache:
                  type: object
                  properties:
                    nodeNVMe: {type: boolean, default: true}
                    cpuRAM: {type: boolean, default: false}
                    gpuVRAM: {type: boolean, default: false}
                targetRef:
                  type: object
                  properties:
                    kind: {type: string, default: Deployment}
                    name: {type: string}
                  required: [name]
                wakeSLO: {type: integer, default: 30}
                coldStartTimeout: {type: integer, default: 300}
                bootstrap:
                  type: object
                  properties:
                    enabled: {type: boolean, default: false}
                    bootstrapModel: {type: string}
                    cpuRAM: {type: string, default: "0"}
                sleepPolicy:
                  type: object
                  properties:
                    sleepDepth: {type: string, enum: [full, warm, tepid, cold], default: full}
                    idleTimeout: {type: integer, default: 300}
                    activeSequenceThreshold: {type: integer, default: 0}
            status:
              type: object
              properties:
                phase: {type: string}
                observedGeneration: {type: integer}
                readyReplicas: {type: integer}
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type: {type: string}
                      status: {type: string}
                      reason: {type: string}
                      message: {type: string}
                      lastTransitionTime: {type: string}
                lastWakeDuration: {type: number}
                gpuHoursSaved: {type: number}
                requestLoss: {type: integer}