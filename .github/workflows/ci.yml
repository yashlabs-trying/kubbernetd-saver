name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Run unit tests
        run: |
          python -m pytest tests/ -v --tb=short

  k8s-e2e:
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install kubbernetd
        run: |
          pip install -e .

      - name: Install kind + kubectl
        run: |
          curl -Lo /usr/local/bin/kind https://kind.sigs.k8s.io/dl/v0.24.0/kind-linux-amd64
          chmod +x /usr/local/bin/kind
          curl -LO "https://dl.k8s.io/release/v1.31.0/bin/linux/amd64/kubectl"
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/

      - name: Create kind cluster
        run: |
          kind create cluster --name kubbernetd-ci --wait 60s
          kubectl cluster-info

      - name: Deploy operator
        run: |
          kubectl create namespace kubbernetd --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f config/crd.yaml
          kubectl apply -f config/operator-rbac.yaml -n kubbernetd
          kubectl apply -f config/operator-deployment.yaml -n kubbernetd
          kubectl wait --for=condition=available deployment/kubbernetd-operator -n kubbernetd --timeout=60s
          kubectl get pods -n kubbernetd

      - name: Deploy test model
        run: |
          kubectl create deployment test-model --image=nginx --replicas=1 --port=80
          kubectl expose deployment test-model --port=80 --target-port=80
          kubectl wait --for=condition=available deployment/test-model --timeout=60s

      - name: Create ReplicaGroup
        run: |
          kubectl apply -f - << 'EOF'
          apiVersion: kubbernetd.io/v1
          kind: ReplicaGroup
          metadata:
            name: test-model-rg
            namespace: default
          spec:
            model:
              name: nginx
              engine: vLLM
              workers: 1
            targetRef:
              kind: Deployment
              name: test-model
            wakeSLO: 15
            sleepPolicy:
              sleepDepth: full
              idleTimeout: 10
          EOF
          kubectl get replicagroups -A

      - name: Verify service responds
        run: |
          kubectl port-forward service/test-model 8080:80 &
          sleep 3
          curl -s -o /dev/null -w "%{http_code}" --max-time 5 http://localhost:8080/ || echo "FAIL"
          kill %1 || true

      - name: Wait for idle scale-down
        run: |
          echo "Waiting 20s for idle timeout..."
          sleep 25
          REPLICAS=$(kubectl get deployment test-model -o jsonpath='{.spec.replicas}')
          echo "Replicas after idle: $REPLICAS"
          if [ "$REPLICAS" = "0" ]; then
            echo "SCALE_TO_ZERO: PASS"
          else
            echo "SCALE_TO_ZERO: FAIL (replicas=$REPLICAS)"
            exit 1
          fi

      - name: Test wake from cold
        run: |
          kubectl scale deployment test-model --replicas=1
          kubectl wait --for=condition=available deployment/test-model --timeout=60s
          kubectl port-forward service/test-model 8081:80 &
          sleep 3
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 http://localhost:8081/ || echo "000")
          echo "HTTP after wake: $HTTP_CODE"
          if [ "$HTTP_CODE" = "200" ]; then
            echo "WAKE_FROM_COLD: PASS"
          else
            echo "WAKE_FROM_COLD: FAIL"
            exit 1
          fi
          kill %1 || true

      - name: Validate dashboard
        run: |
          kubbernetd status
          kubectl get replicagroups test-model-rg -n default -o json | grep -q "RUNNING" || echo "State may be SLEEPING"

      - name: Cleanup
        run: |
          kind delete cluster --name kubbernetd-ci || true