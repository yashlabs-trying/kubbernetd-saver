apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: costsavers.kubbernetd.io
spec:
  group: kubbernetd.io
  names:
    kind: CostSaver
    plural: costsavers
    singular: costsaver
    shortNames:
      - ks
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                target:
                  type: object
                  properties:
                    kind:
                      type: string
                      default: Deployment
                    name:
                      type: string
                  required:
                    - name
                idleTimeout:
                  type: integer
                  default: 300
                  description: Seconds of idle before scaling to zero
                minReplicas:
                  type: integer
                  default: 0
                maxReplicas:
                  type: integer
                  default: 10
                shadowPods:
                  type: integer
                  default: 1
                  description: Number of hidden warm pods for instant cold start