apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubbernetd-proxy
  namespace: kubbernetd
  labels:
    app: kubbernetd-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubbernetd-proxy
  template:
    metadata:
      labels:
        app: kubbernetd-proxy
    spec:
      serviceAccountName: kubbernetd-proxy
      containers:
        - name: proxy
          image: kubbernetd/proxy:ci
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: KUBBERNETD_UPSTREAM_PORT
              value: "80"
            - name: KUBBERNETD_REQUEST_TTL
              value: "60"
            - name: KUBBERNETD_UPSTREAM_TIMEOUT
              value: "300"
