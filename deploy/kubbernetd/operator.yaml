apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubbernetd-operator
  namespace: kubbernetd
  labels:
    app: kubbernetd-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubbernetd-operator
  template:
    metadata:
      labels:
        app: kubbernetd-operator
    spec:
      serviceAccountName: kubbernetd-operator
      containers:
        - name: operator
          image: ghcr.io/kubbernetd/operator:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: metrics
          env:
            - name: KUBBERNETD_IDLE_TIMEOUT
              value: "300"
            - name: KUBBERNETD_CHECK_INTERVAL
              value: "10"
            - name: KUBBERNETD_METRICS_PORT
              value: "8080"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi