namespace: kubbernetd

operator:
  image: ghcr.io/kubbernetd/operator:latest
  imagePullPolicy: IfNotPresent
  replicas: 1
  idleTimeout: 300
  checkInterval: 30
  metricsPort: 8080
  shadowPods: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

proxy:
  enabled: false
  image: ghcr.io/kubbernetd/proxy:latest
  replicas: 1
  upstreamPort: 8080
  requestTtl: 30

agent:
  warmupCommand: ""
  modelPath: ""