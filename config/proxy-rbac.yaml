apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubbernetd-proxy
  namespace: kubbernetd
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubbernetd-proxy
rules:
  # Discovery: find backend pod IPs
  - apiGroups: [""]
    resources: ["endpoints", "services"]
    verbs: ["get", "list", "watch"]
  # Auth + wake signaling: read ReplicaGroups, annotate for wake
  - apiGroups: ["kubbernetd.io"]
    resources: ["replicagroups", "replicagroups/status"]
    verbs: ["get", "list", "watch", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubbernetd-proxy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubbernetd-proxy
subjects:
  - kind: ServiceAccount
    name: kubbernetd-proxy
    namespace: kubbernetd
