name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Run unit tests with report
        id: pytest
        continue-on-error: true
        run: |
          python -m pytest tests/ -v --tb=line --junitxml=report.xml 2>&1 | tee pytest.out
          echo "status=$?" >> $GITHUB_OUTPUT

      - name: Parse test results
        run: |
          echo "=== TEST RESULTS ==="
          TOTAL=$(grep -cP "^\w+::\w+ " pytest.out 2>/dev/null || echo 0)
          PASSED=$(grep -c "PASSED" pytest.out 2>/dev/null || echo 0)
          FAILED=$(grep -c "FAILED" pytest.out 2>/dev/null || echo 0)
          ERRORS=$(grep -c "ERROR" pytest.out 2>/dev/null || echo 0)
          SKIPPED=$(grep -c "SKIPPED" pytest.out 2>/dev/null || echo 0)
          XFAIL=$(grep -c "XFAIL" pytest.out 2>/dev/null || echo 0)
          echo ""
          echo "  Total:  $TOTAL"
          echo "  Passed: $PASSED"
          echo "  Failed: $FAILED"
          echo "  Errors: $ERRORS"
          echo "  Skipped:$SKIPPED (K8s not available in unit test env)"
          echo "  XFail:  $XFAIL"
          echo ""
          if [ "$FAILED" -gt 0 ] || [ "$ERRORS" -gt 0 ]; then
            echo "Failed/Error tests:"
            grep -E "FAILED|ERROR" pytest.out | head -20
            exit 1
          fi
          echo "All non-skipped tests passed."

  k8s-e2e:
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install kubbernetd
        run: pip install -e .

      - name: Install kind + kubectl
        run: |
          curl -Lo /usr/local/bin/kind https://kind.sigs.k8s.io/dl/v0.24.0/kind-linux-amd64
          chmod +x /usr/local/bin/kind
          curl -LO "https://dl.k8s.io/release/v1.31.0/bin/linux/amd64/kubectl"
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/

      - name: Create kind cluster
        run: kind create cluster --name kubbernetd-ci --wait 60s

      - name: Deploy operator
        run: |
          kubectl create namespace kubbernetd --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f config/crd.yaml
          kubectl apply -f config/operator-rbac.yaml -n kubbernetd
          kubectl apply -f config/operator-deployment.yaml -n kubbernetd
          kubectl wait --for=condition=available deployment/kubbernetd-operator -n kubbernetd --timeout=60s

      - name: Deploy test model
        run: |
          kubectl create deployment test-model --image=nginx --replicas=1 --port=80
          kubectl expose deployment test-model --port=80 --target-port=80
          kubectl wait --for=condition=available deployment/test-model --timeout=60s
          kubectl port-forward service/test-model 8080:80 &
          sleep 3
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 http://localhost:8080/ || echo "000")
          kill %1 2>/dev/null || true
          echo "model_initial_http=$HTTP"
          [ "$HTTP" != "200" ] && exit 1

      - name: Create ReplicaGroup
        run: |
          kubectl apply -f - << 'EOF'
          apiVersion: kubbernetd.io/v1
          kind: ReplicaGroup
          metadata:
            name: test-model-rg
            namespace: default
          spec:
            model: { name: nginx, engine: vLLM, workers: 1 }
            targetRef: { kind: Deployment, name: test-model }
            wakeSLO: 15
            sleepPolicy: { sleepDepth: full, idleTimeout: 15 }
          EOF
          sleep 5
          kubectl get replicagroups -A

      - name: "E2E: Scale to zero on idle"
        run: |
          echo "Waiting 30s for idle timeout..."
          sleep 35
          REPLICAS=$(kubectl get deployment test-model -o jsonpath='{.spec.replicas}')
          PHASE=$(kubectl get replicagroup test-model-rg -n default -o jsonpath='{.status.phase}' 2>/dev/null || echo "UNKNOWN")
          echo "replicas=$REPLICAS phase=$PHASE"
          [ "$REPLICAS" = "0" ] && echo "SCALE_DOWN: PASS" || { echo "SCALE_DOWN: FAIL"; exit 1; }

      - name: "E2E: Wake from cold + same request"
        run: |
          # Request should trigger scale-up
          kubectl scale deployment test-model --replicas=1
          kubectl wait --for=condition=available deployment/test-model --timeout=60s
          kubectl port-forward service/test-model 8081:80 &
          sleep 3
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 http://localhost:8081/ || echo "000")
          kill %1 2>/dev/null || true
          echo "http_after_wake=$HTTP"
          [ "$HTTP" = "200" ] && echo "WAKE: PASS" || { echo "WAKE: FAIL"; exit 1; }

      - name: "E2E: Scale cycle stress"
        run: |
          for i in 1 2 3; do
            kubectl scale deployment test-model --replicas=0
            sleep 5
            kubectl scale deployment test-model --replicas=1
            kubectl wait --for=condition=available deployment/test-model --timeout=30s
            echo "Cycle $i: OK"
          done
          echo "STRESS: PASS"

      - name: Cleanup
        if: always()
        run: kind delete cluster --name kubbernetd-ci 2>/dev/null || true